<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quizzy.News — Question Review</title>
<style>
  :root {
    --purple: #6C63FF;
    --purple-dark: #4F46C4;
    --light: #F4F3FF;
    --ink: #1F2033;
    --muted: #6B6C82;
    --line: #E2E1F2;
    --good: #12855F;
    --good-bg: #E4F6EF;
    --bad: #B3261E;
    --bad-bg: #FDECEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 96px;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--light);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    margin: 0 -16px 24px; padding: 16px;
    background: #fff; border-bottom: 1px solid var(--line);
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -0.01em; }
  .sub { margin: 0; color: var(--muted); font-size: 13px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  input[type="date"], select {
    padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; background: #fff; color: var(--ink);
  }
  button {
    padding: 9px 16px; border: 0; border-radius: 8px; font: inherit;
    font-weight: 600; cursor: pointer; background: var(--purple); color: #fff;
  }
  button:hover:not(:disabled) { background: var(--purple-dark); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--purple); border: 1px solid var(--line); }
  #status {
    margin-top: 12px; padding: 11px 13px; border-radius: 8px; font-size: 13px;
    background: #fff; border: 1px solid var(--line); display: none; white-space: pre-wrap;
  }
  #status.show { display: block; }
  #status.err { background: var(--bad-bg); border-color: #F5C6C2; color: var(--bad); }
  #status.ok { background: var(--good-bg); border-color: #BFE7D8; color: var(--good); }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 14px;
  }
  .card.approved { border-color: #BFE7D8; background: var(--good-bg); }
  .card.rejected { border-color: #F5C6C2; background: var(--bad-bg); opacity: .75; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
          font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .pill { padding: 2px 9px; border-radius: 999px; background: var(--light); font-weight: 600; }
  .pill.warn { background: #FFF3D6; color: #8A5A00; }
  .q { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  ul.choices { list-style: none; padding: 0; margin: 0 0 12px; }
  ul.choices li {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    margin-bottom: 6px; background: #fff; font-size: 14px;
  }
  ul.choices li.correct { border-color: var(--good); background: var(--good-bg); font-weight: 600; }
  ul.choices li.correct::after { content: " ✓ correct answer"; color: var(--good); font-weight: 500; font-size: 12px; }
  .headline { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .headline a { color: var(--purple); }
  .actions { display: flex; gap: 8px; }
  .actions button { flex: 0 0 auto; }
  .btn-ok { background: var(--good); }
  .btn-ok:hover:not(:disabled) { background: #0D6B4C; }
  .btn-no { background: var(--bad); }
  .btn-no:hover:not(:disabled) { background: #8C1E17; }
  .savebar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
    background: #fff; border-top: 1px solid var(--line);
    display: flex; gap: 12px; align-items: center; justify-content: center;
  }
  .savebar .count { font-size: 13px; color: var(--muted); }
  code { background: var(--light); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  details { margin-top: 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--purple); }
  pre { background: var(--ink); color: #EDECFF; padding: 12px; border-radius: 8px;
        overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Quizzy.News — Question Review</h1>
    <p class="sub">Approve the questions that should go live. Nothing is written until you press Save.</p>
    <div class="controls">
      <input type="date" id="date" />
      <button id="load">Load day</button>
      <button id="prevDay" class="ghost">← Previous day</button>
      <button id="latest" class="ghost">Jump to newest</button>
      <select id="filter">
        <option value="all">Show all</option>
        <option value="pending">Only undecided</option>
        <option value="approved">Only approved</option>
      </select>
    </div>
    <div id="status"></div>
  </div>
</header>

<div class="wrap" id="list"></div>

<div class="savebar">
  <span class="count" id="count">Nothing loaded</span>
  <button id="save" disabled>Save to Firestore</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, updateDoc, collection,
  query, orderBy, limit, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Same public web config the app ships with — not a secret, it is in every
// browser bundle by design. Firestore Security Rules are what protect writes.
const firebaseConfig = {
  apiKey: "AIzaSyDIpEdbHCrwgudlLPb8uh-D8rg9A-gyX-I",
  authDomain: "qz-news.firebaseapp.com",
  projectId: "qz-news",
  storageBucket: "qz-news.appspot.com",
  messagingSenderId: "949669847499",
  appId: "1:949669847499:web:a796fdc3aa2029b833964e",
};

const db = getFirestore(initializeApp(firebaseConfig));

const $ = (id) => document.getElementById(id);
const statusEl = $("status");
let currentDate = null;
let rows = [];          // { raw, question, answer, choices, ambiguity, title, url, decision }

function say(msg, kind = "") {
  statusEl.textContent = msg;
  statusEl.className = "show " + kind;
}

/** Mirrors firebase/quizSelection.js — trims field names so "approved " is read correctly. */
function normalizeKeys(obj) {
  const out = {};
  for (const k of Object.keys(obj || {})) out[String(k).trim()] = obj[k];
  return out;
}

function render() {
  const filter = $("filter").value;
  const list = $("list");
  list.innerHTML = "";

  const visible = rows.filter((r) =>
    filter === "all" ? true :
    filter === "pending" ? r.decision === null :
    r.decision === true
  );

  if (!rows.length) {
    list.innerHTML = `<div class="card"><p class="sub">No questions in this day's document.</p></div>`;
  }

  visible.forEach((r) => {
    const card = document.createElement("div");
    card.className = "card" + (r.decision === true ? " approved" : r.decision === false ? " rejected" : "");

    const ambiguityPill = r.ambiguity === null
      ? `<span class="pill warn">no score</span>`
      : `<span class="pill${r.ambiguity > 0.35 ? " warn" : ""}">ambiguity ${r.ambiguity.toFixed(2)}</span>`;

    card.innerHTML = `
      <div class="meta">
        ${ambiguityPill}
        <span class="pill">${r.decision === true ? "approved" : r.decision === false ? "rejected" : "undecided"}</span>
        ${r.sourceName ? `<span>${r.sourceName}</span>` : ""}
      </div>
      <p class="q">${escapeHtml(r.question)}</p>
      <ul class="choices">
        ${r.choices.map((c) => `<li class="${c === r.answer ? "correct" : ""}">${escapeHtml(c)}</li>`).join("")}
      </ul>
      ${r.title ? `<div class="headline">${escapeHtml(r.title)}${
        r.url ? ` — <a href="${escapeAttr(r.url)}" target="_blank" rel="noopener">read the article ↗</a>` : ""
      }</div>` : ""}
      <div class="actions">
        <button class="btn-ok">Approve</button>
        <button class="btn-no">Reject</button>
        <button class="ghost">Clear</button>
      </div>
    `;

    const [ok, no, clear] = card.querySelectorAll("button");
    ok.onclick = () => { r.decision = true; render(); };
    no.onclick = () => { r.decision = false; render(); };
    clear.onclick = () => { r.decision = null; render(); };

    list.appendChild(card);
  });

  const approved = rows.filter((r) => r.decision === true).length;
  const undecided = rows.filter((r) => r.decision === null).length;
  $("count").textContent = rows.length
    ? `${approved} approved · ${undecided} undecided · ${rows.length} total` +
      (approved < 5 ? "  — need 5 for the day to go live" : "  ✓ enough to publish")
    : "Nothing loaded";
  $("save").disabled = !rows.length;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
const escapeAttr = escapeHtml;

async function loadDay(dateStr) {
  say(`Loading ${dateStr}…`);
  rows = [];
  try {
    const snap = await getDoc(doc(db, "dailies", dateStr));
    if (!snap.exists()) {
      currentDate = dateStr;
      say(`No document exists for ${dateStr}. The generator never published that day.`, "err");
      render();
      return;
    }
    const raw = snap.data()?.quiz;
    if (!Array.isArray(raw)) {
      say(`${dateStr} has no quiz array.`, "err");
      render();
      return;
    }
    rows = raw.map((item, index) => {
      const f = normalizeKeys(item);
      const src = normalizeKeys(f.source);
      const amb = Number.parseFloat(f.ambiguity);
      return {
        index,
        question: f.question ?? "(missing question)",
        answer: f.answer ?? "",
        choices: Array.isArray(f.choices) ? f.choices : [],
        ambiguity: Number.isFinite(amb) ? amb : null,
        title: f.title ?? "",
        url: src.url ?? "",
        sourceName: src.name ?? "",
        decision: f.approved === true || f.approved === "true" ? true : null,
      };
    });
    currentDate = dateStr;
    const preApproved = rows.filter((r) => r.decision === true).length;
    say(`Loaded ${rows.length} questions from ${dateStr}. ${preApproved} already approved.`, "ok");
    render();
  } catch (err) {
    say(`Could not read ${dateStr}.\n${err.message}`, "err");
  }
}

async function save() {
  if (!currentDate) return;
  $("save").disabled = true;
  say("Saving…");
  try {
    const snap = await getDoc(doc(db, "dailies", currentDate));
    const original = snap.data()?.quiz ?? [];

    // Rewrite each entry with a CLEAN `approved` key. Any stray "approved "
    // variant is removed here, which is what stops the trailing-space bug
    // from coming back.
    const updated = original.map((item, i) => {
      const clean = {};
      for (const k of Object.keys(item || {})) {
        if (String(k).trim() === "approved") continue;
        clean[String(k).trim()] = item[k];
      }
      const row = rows.find((r) => r.index === i);
      if (row && row.decision !== null) clean.approved = row.decision;
      return clean;
    });

    await updateDoc(doc(db, "dailies", currentDate), { quiz: updated });
    const n = rows.filter((r) => r.decision === true).length;
    say(`Saved ${currentDate}. ${n} question${n === 1 ? "" : "s"} approved.` +
        (n >= 5 ? " This day is now playable." : " Needs 5 to go live."), "ok");
  } catch (err) {
    const denied = /permission|insufficient/i.test(err.message);
    say(
      `Save failed.\n${err.message}` +
      (denied
        ? `\n\nFirestore is refusing writes from the browser — which is correct default behaviour.\n` +
          `Send me a screenshot of this and I'll give you the exact security rule to add.`
        : ""),
      "err"
    );
  } finally {
    $("save").disabled = false;
  }
}

async function jumpToLatest() {
  say("Finding the newest published day…");
  try {
    const q = query(collection(db, "dailies"), orderBy("__name__", "desc"), limit(1));
    const snap = await getDocs(q);
    if (snap.empty) return say("The dailies collection is empty.", "err");
    const id = snap.docs[0].id;
    $("date").value = id;
    await loadDay(id);
  } catch (err) {
    say(`Could not list days.\n${err.message}`, "err");
  }
}

function shiftDay(days) {
  const base = $("date").value || new Date().toISOString().slice(0, 10);
  const d = new Date(base + "T12:00:00");
  d.setDate(d.getDate() + days);
  $("date").value = d.toISOString().slice(0, 10);
  loadDay($("date").value);
}

$("date").value = new Date().toISOString().slice(0, 10);
$("load").onclick = () => loadDay($("date").value);
$("prevDay").onclick = () => shiftDay(-1);
$("latest").onclick = jumpToLatest;
$("filter").onchange = render;
$("save").onclick = save;

render();
say("Pick a date and press Load day, or press “Jump to newest”.");
</script>
</body>
</html>
